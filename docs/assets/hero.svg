<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Lanshu Sticker Presenter Video Skill</title>
  <desc id="desc">Green cutting mat with cream paper, handwritten arrows and colorful production labels.</desc>
  <defs>

    <g transform="rotate(-4 1047 225)"><rect x="870" y="181" width="342" height="81" rx="5" fill="#f5d96b"/><text x="894" y="234" fill="#222820" stroke="none" font-family="Arial, sans-serif" font-size="31" font-weight="800">PAPER COLLAGE</text></g>
